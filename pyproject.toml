[project]
name = "taprivo"
version = "0.1.0b7"
description = "Turn finger taps into a playful Motion Energy budget for AI coding agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Sinan Yorulmaz" }]
keywords = ["mcp", "claude-code", "hand-tracking", "developer-tools", "macos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=2.1,<3",
  "mediapipe==0.10.33",
  "httpx2>=2.12,<3",
  "numpy>=2,<3",
  "pydantic>=2.7,<3",
  "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
  "pyside6>=6.8,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
  "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/yorulmazsinan/taprivo"
Issues = "https://github.com/yorulmazsinan/taprivo/issues"

[project.scripts]
taprivo = "taprivo.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taprivo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF012"]
# The multiplication and minus signs are deliberate in user-facing text
# ("1.5x" multipliers, the "-250" that floats away on a spend).
allowed-confusables = ["×", "−"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/taprivo/ui/widgets.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
packages = ["taprivo"]
mypy_path = "src"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:taprivo.*"]
